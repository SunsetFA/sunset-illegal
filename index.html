<style>
:root{
  --bg:#100c08; --bg-soft:#1a1209; --bg-card:rgba(30,16,8,.7);
  --ink:#f0e8d8; --ink-soft:#b89878; --ink-faint:#6e4e32;
  --line:rgba(180,88,22,.18);
  --rust:#8b3a1a; --rust-deep:#5c240f;
  --copper:#b45816; --copper-soft:rgba(180,88,22,.18);
  --danger:#c0392b; --danger-soft:rgba(192,57,43,.15);
  --sunset:linear-gradient(135deg,#5c240f 0%,#8b3a1a 40%,#b45816 75%,#d4824a 100%);
  --radius:6px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--copper-soft);}

.topnav{position:fixed;top:0;left:0;right:0;height:68px;background:rgba(16,12,8,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:300;gap:16px;overflow:visible;}
.topnav::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--sunset);}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:0;text-decoration:none;}
.brand-logo{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--copper);box-shadow:0 0 16px rgba(180,88,22,.55),0 0 3px rgba(180,88,22,.9);}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-name{font-family:Fraunces,serif;font-weight:900;font-size:1.05rem;color:var(--ink);letter-spacing:-.01em;}
.brand-sub{font-family:'IBM Plex Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--copper);}

.nav-menu{display:flex;align-items:center;gap:2px;list-style:none;margin:0;padding:0;overflow:visible;flex-shrink:1;min-width:0;}
.nav-item{position:relative;}
.nav-link,.nav-trigger{font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);background:none;border:none;padding:10px 13px;cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:var(--radius);}
.nav-link:hover,.nav-trigger:hover,.nav-link.active,.nav-trigger.active{color:var(--copper);background:var(--copper-soft);}
.caret{font-size:.55rem;transition:transform .15s;}
.nav-item.open .caret{transform:rotate(180deg);}
.dropdown-panel{position:absolute;top:calc(100% + 8px);left:0;background:#1a1209;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 16px 40px rgba(0,0,0,.6);min-width:220px;padding:6px;display:none;z-index:400;}
.nav-item.open .dropdown-panel{display:block;}
.dropdown-panel a{display:block;font-size:.85rem;color:var(--ink-soft);padding:9px 13px;border-radius:var(--radius);}
.dropdown-panel a:hover,.dropdown-panel a.active{background:var(--copper-soft);color:var(--copper);}

.page-wrap{max-width:800px;margin:0 auto;padding:104px 24px 100px;}
.breadcrumb{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-faint);margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;}
.breadcrumb b{color:var(--copper);font-weight:600;}

#pageContent h1{font-family:Fraunces,serif;font-weight:700;font-size:clamp(1.8rem,3.4vw,2.5rem);letter-spacing:-.01em;margin:0 0 6px;}
#pageContent .page-sub{color:var(--ink-soft);font-size:1rem;margin:0 0 28px;max-width:62ch;}
#pageContent h2{font-family:Fraunces,serif;font-weight:700;font-size:1.28rem;margin:40px 0 14px;display:flex;align-items:center;gap:10px;padding-top:18px;border-top:1px solid var(--line);}
#pageContent h2:first-of-type{margin-top:8px;padding-top:0;border-top:none;}
#pageContent h2 .emo{font-size:1.1rem;}
#pageContent h3{font-family:Inter,sans-serif;font-weight:700;font-size:.88rem;margin:22px 0 7px;color:var(--copper);text-transform:uppercase;letter-spacing:.04em;}
#pageContent p{margin:0 0 12px;color:var(--ink-soft);font-size:.94rem;max-width:66ch;}
#pageContent ul{margin:0 0 16px;padding-left:20px;color:var(--ink-soft);font-size:.94rem;}
#pageContent li{margin-bottom:7px;}
#pageContent li strong{color:var(--ink);}

.callout{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:14px 16px;border-radius:var(--radius);margin:16px 0 22px;border:1px solid transparent;}
.callout .ic{font-size:.95rem;line-height:1;}
.callout strong{display:block;font-size:.78rem;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em;}
.callout p{margin:0;font-size:.88rem;color:var(--ink-soft);}
.callout.info{background:var(--copper-soft);border-color:rgba(180,88,22,.3);} .callout.info strong{color:var(--copper);}
.callout.warning{background:rgba(192,57,43,.12);border-color:rgba(192,57,43,.3);} .callout.warning strong{color:var(--danger);}
.callout.danger{background:rgba(92,36,15,.4);border-color:rgba(139,58,26,.5);} .callout.danger strong{color:#e07050;}

.home-banner{width:100%;border-radius:8px;margin:0 0 28px;display:block;box-shadow:0 16px 40px rgba(0,0,0,.55);}
.home-quote{font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:1.1rem;color:var(--copper);margin:0 0 16px;max-width:52ch;}
.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:26px;}
@media(max-width:560px){.home-grid{grid-template-columns:1fr;}}
.home-card{border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .15s,background .15s;}
.home-card:hover{border-color:var(--copper);background:var(--copper-soft);}
.home-card .hc-num{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--copper);margin-bottom:6px;}
.home-card h3{font-family:Fraunces,serif;font-size:1.02rem;margin:0 0 5px;text-transform:none;color:var(--ink);}
.home-card p{font-size:.84rem;color:var(--ink-soft);margin:0;}

.glossary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 22px;}
@media(max-width:600px){.glossary{grid-template-columns:1fr;}}
.gterm{border-left:3px solid var(--copper);padding-left:13px;}
.gterm dt{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;color:var(--copper);margin-bottom:3px;}
.gterm dd{margin:0;font-size:.87rem;color:var(--ink-soft);}

.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:8px 0 22px;border:1px solid var(--line);}
.scale-step{padding:16px 13px;background:var(--bg-soft);}
.scale-step .bar{height:4px;border-radius:2px;margin-bottom:10px;}
.scale-step .s1{background:#b45816;} .scale-step .s2{background:#8b3a1a;}
.scale-step .s3{background:#c0392b;} .scale-step .s4{background:#5c240f;}
.scale-step .label{font-family:'IBM Plex Mono',monospace;font-size:.63rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:5px;}
.scale-step h4{font-family:Fraunces,serif;font-size:.95rem;margin:0 0 4px;}
.scale-step p{font-size:.8rem;color:var(--ink-soft);margin:0;}

footer{border-top:1px solid var(--line);padding:32px 24px 48px;max-width:800px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;}
footer .f-brand{font-family:Fraunces,serif;font-weight:700;font-size:1rem;color:var(--copper);}
footer p{color:var(--ink-faint);font-size:.78rem;margin:5px 0 0;max-width:44ch;}
</style>

function catOf(id){ return CATS.find(c=>c.pages.includes(id)); }

function buildNav(){
  const menu = document.getElementById('navMenu');
  menu.innerHTML = '';
  const liHome = document.createElement('li'); liHome.className = 'nav-item';
  liHome.innerHTML = '<a class="nav-link" data-page="accueil" href="#accueil">Accueil</a>';
  menu.appendChild(liHome);
  CATS.forEach(cat => {
    const li = document.createElement('li'); li.className = 'nav-item'; li.dataset.cat = cat.id;
    const btn = document.createElement('button'); btn.className = 'nav-trigger'; btn.type = 'button';
    btn.innerHTML = '<span>'+cat.label+'</span><span class="caret">&#9662;</span>';
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const open = li.classList.contains('open');
      document.querySelectorAll('.nav-item.open').forEach(n=>n.classList.remove('open'));
      if(!open) li.classList.add('open');
    });
    const panel = document.createElement('div'); panel.className = 'dropdown-panel';
    cat.pages.forEach(pid => {
      const a = document.createElement('a'); a.href = '#'+pid; a.dataset.page = pid; a.textContent = PAGES[pid].title;
      a.addEventListener('click', ()=>li.classList.remove('open'));
      panel.appendChild(a);
    });
    li.appendChild(btn); li.appendChild(panel); menu.appendChild(li);
  });
}
document.addEventListener('click', ()=>document.querySelectorAll('.nav-item.open').forEach(n=>n.classList.remove('open')));
buildNav();

function render(){
  let id = location.hash.replace('#','') || 'accueil';
  if(id !== 'accueil' && !PAGES[id]) id = 'accueil';
  const bc = document.getElementById('breadcrumb');
  const ct = document.getElementById('pageContent');

  if(id === 'accueil'){
    bc.innerHTML = '<b>Sunset FA</b><span>&#8250;</span><span>Zone Ill&#233;gale</span>';
    const cards = CATS.map((c,i)=>{
      const first = PAGES[c.pages[0]];
      return '<div class="home-card" data-nav="'+c.pages[0]+'"><p class="hc-num">0'+(i+1)+'</p><h3>'+c.label+'</h3><p>'+first.title+' + '+(c.pages.length-1)+' page(s)</p></div>';
    }).join('');
    ct.innerHTML =
      '<img class="home-banner" src="'+document.getElementById('bannerImg').src+'" alt="Bannière Zone Illégale">'
      +'<h1>Zone Ill&#233;gale &#8212; Sunset FA</h1>'
      +'<p class="home-quote">&#171;&nbsp;Stay away. Warning. Forbidden Access.&nbsp;&#187;</p>'
      +'<p class="page-sub">Toutes les r&#232;gles r&#233;gissant les activit&#233;s ill&#233;gales sur le serveur. Tu es responsable de leur connaissance avant d&#39;agir.</p>'
      +'<div class="callout danger"><span class="ic">&#9888;&#65039;</span><div><strong>Attention</strong><p>Le r&#232;glement g&#233;n&#233;ral du serveur reste prioritaire. Ce document le compl&#232;te, il ne s&#39;y substitue pas.</p></div></div>'
      +'<div class="home-grid">'+cards+'</div>';
    ct.querySelectorAll('[data-nav]').forEach(c=>c.addEventListener('click',()=>{location.hash=c.dataset.nav;}));
  } else {
    const page = PAGES[id];
    const cat = catOf(id);
    bc.innerHTML = cat
      ? '<b>Sunset FA</b><span>&#8250;</span><span>'+cat.label+'</span><span>&#8250;</span><span>'+page.title+'</span>'
      : '<b>Sunset FA</b><span>&#8250;</span><span>'+page.title+'</span>';
    ct.innerHTML = '<h1>'+page.title+'</h1><p class="page-sub">'+page.sub+'</p>'+page.content;
  }
  document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active', a.dataset.page===id));
  window.scrollTo({top:0,behavior:'auto'});
}
window.addEventListener('hashchange', render);
document.getElementById('brandBtn').addEventListener('click', ()=>location.hash='accueil');
render();
</script>
